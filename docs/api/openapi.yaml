openapi: 3.1.0
info:
  title: Holy Phase 17 API
  version: 0.1.0
paths:
  /api/admin/self-healing/runs:
    get:
      summary: List self-healing runs
    post:
      summary: Create self-healing run
  /api/optimization/campaigns:
    post:
      summary: Create optimization campaign
  /api/optimization/campaigns/{campaignId}/run:
    post:
      summary: Run optimization campaign
  /api/intelligence/recommendations:
    get:
      summary: List intelligence recommendations
  /api/marketplace/rankings:
    post:
      summary: Query marketplace rankings
  /api/admin/incidents/{incidentId}/postmortem:
    post:
      summary: Generate postmortem draft
  /api/admin/tenants/{workspaceId}/migration-plan:
    post:
      summary: Create tenant migration plan
  /api/improvement-bundles/{bundleId}/apply:
    post:
      summary: Apply improvement bundle
  title: Holy Phase 18 API
  version: 0.1.0
paths:
  /api/admin/regions:
    get:
      summary: List regional control plane health
  /api/admin/regions/{region}/failover:
    post:
      summary: Propose or execute failover with approval gates
  /api/admin/federated/rounds:
    get:
      summary: List federated rounds
  /api/optimization/campaigns/{campaignId}/schedule:
    post:
      summary: Create optimization schedule under policy controls
  /api/admin/marketplace/abuse:
    get:
      summary: List abuse signals and enforcement actions
  /api/admin/tenants/migration-runs/{runId}/execute:
    post:
      summary: Execute approved tenant migration run
  /api/status:
    get:
      summary: Get public component and incident status
  /api/admin/transparency/generate:
    post:
      summary: Generate aggregate transparency report (admin)
  /api/admin/settlement/reconciliation:
    post:
      summary: Run settlement pilot reconciliation (admin)
  /api/workspaces/{workspaceId}/intelligence-policy:
